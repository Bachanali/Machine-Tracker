<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} &middot; Machine Breakdown Tracker</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card" style="text-align:center; max-width:420px;">
    <div class="login-brand">
      <div class="brand-mark">&#9881;</div>
      <h1 style="font-size:15px; color:var(--text-dim); font-weight:600;">Machine Breakdown Tracker</h1>
    </div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size:48px; font-weight:700; color:var(--accent); line-height:1;">{{ code }}</div>
    <div style="font-size:15px; font-weight:600; margin:10px 0 6px;">{{ title }}</div>
    <p style="color:var(--text-dim); font-size:13px; line-height:1.6; margin-bottom:22px;">{{ message }}</p>
    <a class="btn primary" href="/" style="width:100%; justify-content:center;">Back to Dashboard</a>
  </div>
</div>
</body>
</html>
